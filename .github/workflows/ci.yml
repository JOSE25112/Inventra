
name: Inventra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar React
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: inventra_test
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: inventra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventra_test -d inventra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://inventra_test:test_password_only@localhost:5432/inventra_test
      JWT_SECRET_KEY: ci_test_secret_key_not_for_production_123456789
      JWT_EXPIRE_MINUTES: "30"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verificar migraciones
        run: python -m alembic upgrade head

      - name: Ejecutar pruebas
        run: python -m pytest tests -v
